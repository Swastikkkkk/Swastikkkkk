name: snake

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#1d1d1f&color_dots=#f2f2f2,#d2d2d7,#a1a1a6,#6e6e73,#1d1d1f
            dist/snake-dark.svg?color_snake=#f5f5f7&color_dots=#161b22,#2c2c2e,#48484a,#8e8e93,#f5f5f7
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
