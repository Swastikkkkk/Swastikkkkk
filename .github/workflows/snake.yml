name: Contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#0a0a0a&color_dots=#f0f0f0,#d4d4d4,#a3a3a3,#525252,#171717
            dist/snake-dark.svg?palette=github-dark&color_snake=#fafafa&color_dots=#161616,#2e2e2e,#5c5c5c,#a3a3a3,#fafafa

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
