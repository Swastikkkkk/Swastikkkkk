<svg xmlns="http://www.w3.org/2000/svg" width="330" height="190" viewBox="0 0 330 190" role="img" aria-label="brag-ext: Turns any GitHub repo into a short promo video. Voices run locally in the browser."><style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.mono{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace}.chip{font-size:12px;font-weight:500;fill:#525252}.n{font-size:19px;font-weight:700;letter-spacing:-.4px;fill:#0a0a0a}.k{font-size:10.5px;letter-spacing:1.3px;fill:#a3a3a3}.d{font-size:13px;fill:#525252}.go{font-size:15px;fill:#a3a3a3}</style><rect x=".5" y=".5" width="329" height="189" rx="16" fill="#fafafa" stroke="#e5e5e5"/><text class="k mono" x="20" y="34">CHROME EXTENSION</text><text class="go" x="310" y="36" text-anchor="end">↗</text><text class="n" x="19" y="66">brag-ext</text><text class="d" x="20" y="92">Turns any GitHub repo into a short promo</text><text class="d" x="20" y="111">video. Voices run locally in the browser.</text><rect x="20" y="148" width="89" height="26" rx="13" fill="#ffffff" stroke="#e5e5e5"/><text x="64" y="165" text-anchor="middle" class="chip">TypeScript</text><rect x="117" y="148" width="75" height="26" rx="13" fill="#ffffff" stroke="#e5e5e5"/><text x="154" y="165" text-anchor="middle" class="chip">Remotion</text></svg>
