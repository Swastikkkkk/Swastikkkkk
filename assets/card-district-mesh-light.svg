<svg xmlns="http://www.w3.org/2000/svg" width="420" height="212" viewBox="0 0 420 212" role="img" aria-label="District Mesh: Offline mesh for iPhone. Multi-hop messaging, live location, SOS and voice and video calls with no internet and no servers.">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  @keyframes beam { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -1000 } }
  @keyframes nudge { 0%,70%,100% { transform: translate(0,0) } 80% { transform: translate(2px,-2px) } }
  @keyframes ping { 0% { transform: scale(1); opacity: .9 } 80%,100% { transform: scale(2.6); opacity: 0 } }
  @keyframes up { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
  .cat { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 10.5px; letter-spacing: 1.6px; fill: #8a8a8a; }
  .title { font-size: 25px; font-weight: 650; letter-spacing: -0.6px; fill: #0a0a0a; transform-box: fill-box; animation: up .8s cubic-bezier(.2,.7,.2,1) 0.30s both; }
  .desc { font-size: 13.5px; fill: #525252; }
  .pill { font-size: 11.5px; font-weight: 500; fill: #404040; }
</style>
<rect x="0.5" y="0.5" width="419" height="211" rx="14" fill="#ffffff" stroke="#e5e5e5"/>
<rect x="0.75" y="0.75" width="418.5" height="210.5" rx="14" fill="none" stroke="#0a0a0a"
  stroke-width="1.5" pathLength="1000" stroke-dasharray="90 910" stroke-linecap="round"
  opacity="0.7" style="animation: beam 8s linear -2.6s infinite"/>
<text x="22" y="37" class="cat">iOS  ·  OFFLINE-FIRST</text>

<g transform="translate(384 26)"><g style="animation: nudge 3s ease-in-out 1.8s infinite">
  <path d="M1 13 L13 1 M4.5 1 H13 V9.5" fill="none" stroke="#8a8a8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</g></g>
<text x="22" y="75" class="title">District Mesh</text>
<text x="22" y="104" class="desc">Offline mesh for iPhone. Multi-hop messaging,</text>
<text x="22" y="124" class="desc">live location, SOS and voice and video calls</text>
<text x="22" y="144" class="desc">with no internet and no servers.</text>
<rect x="22.0" y="170" width="53.0" height="22" rx="11" fill="#f7f7f7" stroke="#e5e5e5"/><text x="48.5" y="185" text-anchor="middle" class="pill">Swift</text><rect x="81.0" y="170" width="66.2" height="22" rx="11" fill="#f7f7f7" stroke="#e5e5e5"/><text x="114.1" y="185" text-anchor="middle" class="pill">SwiftUI</text><rect x="153.2" y="170" width="79.4" height="22" rx="11" fill="#f7f7f7" stroke="#e5e5e5"/><text x="192.9" y="185" text-anchor="middle" class="pill">Multipeer</text><rect x="238.6" y="170" width="92.6" height="22" rx="11" fill="#f7f7f7" stroke="#e5e5e5"/><text x="284.9" y="185" text-anchor="middle" class="pill">ActivityKit</text>
</svg>