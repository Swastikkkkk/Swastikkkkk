<svg xmlns="http://www.w3.org/2000/svg" width="420" height="212" viewBox="0 0 420 212" role="img" aria-label="agentdrift: Finds duplicated and contradicting rules across AGENTS.md, CLAUDE.md, .cursorrules and Copilot instructions, then merges them into one file.">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  @keyframes beam { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -1000 } }
  @keyframes nudge { 0%,70%,100% { transform: translate(0,0) } 80% { transform: translate(2px,-2px) } }
  @keyframes ping { 0% { transform: scale(1); opacity: .9 } 80%,100% { transform: scale(2.6); opacity: 0 } }
  @keyframes up { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
  .cat { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 10.5px; letter-spacing: 1.6px; fill: #8a8a8a; }
  .title { font-size: 25px; font-weight: 650; letter-spacing: -0.6px; fill: #0a0a0a; transform-box: fill-box; animation: up .8s cubic-bezier(.2,.7,.2,1) 0.75s both; }
  .desc { font-size: 13.5px; fill: #525252; }
  .pill { font-size: 11.5px; font-weight: 500; fill: #404040; }
</style>
<rect x="0.5" y="0.5" width="419" height="211" rx="14" fill="#ffffff" stroke="#e5e5e5"/>
