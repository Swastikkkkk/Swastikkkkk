<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-label="SketchRacer: draw a loop, it becomes a track, then race it"><style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif}.mono{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace}.ct{font-size:12px;font-weight:500;fill:#a1a1a6}.k{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;letter-spacing:1.6px;fill:#6e6e73}.up{animation:up .9s cubic-bezier(.22,.8,.24,1) both}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.fade{animation:fade 1.2s ease both}@keyframes fade{from{opacity:0}to{opacity:1}}.trk{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.8s cubic-bezier(.22,.8,.24,1) .1s forwards}.trk2{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.8s cubic-bezier(.22,.8,.24,1) .3s forwards}@keyframes draw{to{stroke-dashoffset:0}}.t{font-size:40px;font-weight:700;letter-spacing:-1.4px;fill:#f5f5f7}.d{font-size:15px;fill:#a1a1a6}.clk{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace;font-size:34px;font-weight:600;fill:#f5f5f7}.cl{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:1.4px;fill:#6e6e73}.cta{font-size:13.5px;font-weight:600;fill:#f5f5f7}.flag{animation:flag 6.0s steps(1) 2.0s infinite}@keyframes flag{0%{opacity:1}6%{opacity:.25}100%{opacity:.25}}.rs{animation:rs 6.0s steps(6) 2.0s infinite}@keyframes rs{to{transform:translateY(-240px)}}.rt{animation:rt 1.0s steps(10) 2.0s infinite}@keyframes rt{to{transform:translateY(-400px)}}.rh{animation:rh 0.1s steps(10) 2.0s infinite}@keyframes rh{to{transform:translateY(-400px)}}.lp{animation:lp 18.0s steps(3) 2.0s infinite}@keyframes lp{to{transform:translateY(-120px)}}</style><rect x=".5" y=".5" width="999" height="289" rx="22" fill="rgba(255,255,255,.025)" stroke="rgba(255,255,255,.10)"/><text class="k up" x="40" y="50">ARCADE</text><text class="t up" style="animation-delay:0.08s" x="38" y="98">Draw it. Race it.</text><g class="up" style="animation-delay:0.16s"><text class="d" x="40" y="130">Freehand a loop in SketchRacer and it turns into a</text><text class="d" x="40" y="152">real track with checkpoints and lap timing.</text></g><g class="up" style="animation-delay:0.30s"><text class="cl" x="40" y="186">LAP TIME</text><text class="clk" x="40" y="222">0:0</text><text class="clk" x="122" y="222">.</text><clipPath id="qs"><rect x="100" y="192" width="22" height="40"/></clipPath><g clip-path="url(#qs)"><g class="rs"><text class="clk" x="101" y="222">0</text><text class="clk" x="101" y="262">1</text><text class="clk" x="101" y="302">2</text><text class="clk" x="101" y="342">3</text><text class="clk" x="101" y="382">4</text><text class="clk" x="101" y="422">5</text><text class="clk" x="101" y="462">0</text></g></g><clipPath id="qt"><rect x="141" y="192" width="22" height="40"/></clipPath><g clip-path="url(#qt)"><g class="rt"><text class="clk" x="142" y="222">0</text><text class="clk" x="142" y="262">1</text><text class="clk" x="142" y="302">2</text><text class="clk" x="142" y="342">3</text><text class="clk" x="142" y="382">4</text><text class="clk" x="142" y="422">5</text><text class="clk" x="142" y="462">6</text><text class="clk" x="142" y="502">7</text><text class="clk" x="142" y="542">8</text><text class="clk" x="142" y="582">9</text><text class="clk" x="142" y="622">0</text></g></g><clipPath id="qh"><rect x="162" y="192" width="22" height="40"/></clipPath><g clip-path="url(#qh)"><g class="rh"><text class="clk" x="163" y="222">0</text><text class="clk" x="163" y="262">1</text><text class="clk" x="163" y="302">2</text><text class="clk" x="163" y="342">3</text><text class="clk" x="163" y="382">4</text><text class="clk" x="163" y="422">5</text><text class="clk" x="163" y="462">6</text><text class="clk" x="163" y="502">7</text><text class="clk" x="163" y="542">8</text><text class="clk" x="163" y="582">9</text><text class="clk" x="163" y="622">0</text></g></g><text class="cl" x="230" y="186">LAP</text><clipPath id="ql"><rect x="229" y="192" width="80" height="40"/></clipPath><g clip-path="url(#ql)"><g class="lp"><text class="clk" x="230" y="222">1/3</text><text class="clk" x="230" y="262">2/3</text><text class="clk" x="230" y="302">3/3</text><text class="clk" x="230" y="342">1/3</text></g></g></g><text class="cta up" style="animation-delay:0.40s" x="40" y="262">Play at sketchracer.com ↗</text><path class="trk" pathLength="1000" d="M600,212 C568,160 584,78 660,66 C736,54 770,122 834,104 C898,86 958,98 958,160 C958,222 900,246 822,238 C760,232 742,196 700,218 C660,240 622,250 600,212 Z" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="22" stroke-linejoin="round"/><path class="trk2" pathLength="1000" d="M600,212 C568,160 584,78 660,66 C736,54 770,122 834,104 C898,86 958,98 958,160 C958,222 900,246 822,238 C760,232 742,196 700,218 C660,240 622,250 600,212 Z" fill="none" stroke="#6e6e73" stroke-width="1.4" stroke-dasharray="6 9" opacity=".7" transform="translate(1.5,-1)"/><path class="trk" pathLength="1000" d="M600,212 C568,160 584,78 660,66 C736,54 770,122 834,104 C898,86 958,98 958,160 C958,222 900,246 822,238 C760,232 742,196 700,218 C660,240 622,250 600,212 Z" fill="none" stroke="#a1a1a6" stroke-width="1.6" opacity=".55" transform="translate(-1,1.5)"/><line x1="588.9" y1="218.8" x2="611.1" y2="205.2" stroke="#000" stroke-width="5"/><line class="flag" x1="588.9" y1="218.8" x2="611.1" y2="205.2" stroke="#f5f5f7" stroke-width="5" stroke-dasharray="3.25 3.25"/><path pathLength="1000" d="M600,212 C568,160 584,78 660,66 C736,54 770,122 834,104 C898,86 958,98 958,160 C958,222 900,246 822,238 C760,232 742,196 700,218 C660,240 622,250 600,212 Z" fill="none" stroke="#f5f5f7" stroke-width="3" stroke-linecap="round" stroke-dasharray="70 930" stroke-dashoffset="70" opacity="0"><set attributeName="opacity" to=".55" begin="2.0s"/><animate attributeName="stroke-dashoffset" from="70" to="-930" dur="6.0s" begin="2.0s" repeatCount="indefinite"/></path><g opacity="0"><set attributeName="opacity" to="1" begin="2.0s"/><animateMotion dur="6.0s" begin="2.0s" repeatCount="indefinite" rotate="auto" path="M600,212 C568,160 584,78 660,66 C736,54 770,122 834,104 C898,86 958,98 958,160 C958,222 900,246 822,238 C760,232 742,196 700,218 C660,240 622,250 600,212 Z"/><rect x="-9" y="-5" width="18" height="10" rx="3" fill="#f5f5f7"/><rect x="2" y="-3.5" width="4" height="7" rx="1" fill="#000" opacity=".7"/></g></svg>
