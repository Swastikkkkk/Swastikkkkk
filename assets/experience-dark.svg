<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="301" viewBox="0 0 1000 301" role="img" aria-label="Experience: Next JPMorgan Chase, Software Engineer; 2026 JPMorgan Chase, iOS Payments intern; 2025 KPMG, Academic intern; 2024 NetNivaran, Web development intern"><style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}.ct{font-size:12px;font-weight:500;fill:#a1a1a6}.lb{font-size:13px;font-weight:500;fill:#6e6e73}.up{animation:up 1s cubic-bezier(.22,.8,.24,1) both}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.bi{animation:bi 1.1s cubic-bezier(.22,.8,.24,1) both}@keyframes bi{from{opacity:0;filter:blur(10px);transform:translateY(6px)}to{opacity:1;filter:blur(0);transform:none}}.hl{transform-box:fill-box;transform-origin:left;animation:hl 1.4s cubic-bezier(.22,.8,.24,1) both}@keyframes hl{from{transform:scaleX(0)}to{transform:scaleX(1)}}.rn{font-size:18px;font-weight:600;letter-spacing:-.3px;fill:#f5f5f7}.rk{font-size:14.5px;fill:#a1a1a6}.rd{font-size:14.5px;fill:#6e6e73}.ra{font-size:16px;fill:#6e6e73}.yr{font-size:14.5px;font-weight:500;fill:#6e6e73}.now{transform-box:fill-box;transform-origin:center;animation:now 2.4s ease-out 1.2s infinite;opacity:0}@keyframes now{0%{transform:scale(1);opacity:.5}100%{transform:scale(3);opacity:0}}</style><text class="lb up" x="0" y="20">Experience</text><rect class="hl" style="animation-delay:0.10s" x="0" y="44" width="1000" height="1" fill="rgba(255,255,255,.10)"/><g class="up" style="animation-delay:0.20s"><circle class="now" cx="5" cy="78" r="4" fill="#f5f5f7"/><circle cx="5" cy="78" r="4" fill="#f5f5f7"/><text class="yr" x="20" y="83">Next</text><text class="rn" x="100" y="83">JPMorgan Chase</text><text class="rk" x="340" y="83">Software Engineer</text><text class="rd" x="1000" y="83" text-anchor="end">Joining full time after graduation</text></g><rect class="hl" style="animation-delay:0.20s" x="0" y="108" width="1000" height="1" fill="rgba(255,255,255,.10)"/><g class="up" style="animation-delay:0.30s"><text class="yr" x="0" y="147">2026</text><text class="rn" x="100" y="147">JPMorgan Chase</text><text class="rk" x="340" y="147">iOS Payments intern</text><text class="rd" x="1000" y="147" text-anchor="end">UIKit to SwiftUI and MVVM in the Chase app</text></g><rect class="hl" style="animation-delay:0.30s" x="0" y="172" width="1000" height="1" fill="rgba(255,255,255,.10)"/><g class="up" style="animation-delay:0.40s"><text class="yr" x="0" y="211">2025</text><text class="rn" x="100" y="211">KPMG</text><text class="rk" x="340" y="211">Academic intern</text><text class="rd" x="1000" y="211" text-anchor="end">Ministry dashboards, 40% less manual reporting</text></g><rect class="hl" style="animation-delay:0.40s" x="0" y="236" width="1000" height="1" fill="rgba(255,255,255,.10)"/><g class="up" style="animation-delay:0.50s"><text class="yr" x="0" y="275">2024</text><text class="rn" x="100" y="275">NetNivaran</text><text class="rk" x="340" y="275">Web development intern</text><text class="rd" x="1000" y="275" text-anchor="end">Mobile-first rebuild, 60% faster loads</text></g><rect class="hl" style="animation-delay:0.60s" x="0" y="300" width="1000" height="1" fill="rgba(255,255,255,.10)"/></svg>
