<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300" role="img" aria-label="JalNetra: Flood early warning on 681 rivers. Predicts which villages flood and calls the village head in Hindi."><style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.mono{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace}.chip{font-size:12px;font-weight:500;fill:#525252}.n{font-size:26px;font-weight:700;letter-spacing:-.7px;fill:#0a0a0a}.k{font-size:11px;letter-spacing:1.4px;fill:#a3a3a3}.big{font-size:64px;font-weight:700;letter-spacing:-2.5px;fill:#0a0a0a}.bl{font-size:14px;fill:#525252}.d{font-size:14px;fill:#525252}.go{font-size:13px;font-weight:600;fill:#0a0a0a}.rise{animation:rise 1s cubic-bezier(.2,.7,.2,1) .2s both}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}</style><rect x=".5" y=".5" width="499" height="299" rx="20" fill="#fafafa" stroke="#e5e5e5"/><text class="k mono" x="28" y="44">DISASTER RESPONSE</text><text class="go" x="472" y="44" text-anchor="end">Open ↗</text><text class="n" x="27" y="82">JalNetra</text><g><text class="big" x="24" y="164">681</text><text class="bl" x="156" y="136">river points checked every 3 hours</text><text class="bl" x="156" y="156">across India</text></g><line x1="28" y1="192" x2="472" y2="192" stroke="#e5e5e5"/><text class="d" x="28" y="220">Flood early warning on 681 rivers. Predicts which villages</text><text class="d" x="28" y="240">flood and calls the village head in Hindi.</text><rect x="28" y="254" width="92" height="26" rx="13" fill="#ffffff" stroke="#e5e5e5"/><text x="74" y="271" text-anchor="middle" class="chip">AWS Lambda</text><rect x="128" y="254" width="71" height="26" rx="13" fill="#ffffff" stroke="#e5e5e5"/><text x="163" y="271" text-anchor="middle" class="chip">Bedrock</text><rect x="206" y="254" width="43" height="26" rx="13" fill="#ffffff" stroke="#e5e5e5"/><text x="228" y="271" text-anchor="middle" class="chip">RDS</text></svg>
