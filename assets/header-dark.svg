<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Swastik Dutt, Full Stack AI Engineer">
<defs>
  <clipPath id="card"><rect width="1200" height="440" rx="20"/></clipPath>
  <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-400" y1="0" x2="0" y2="0">
    <stop offset="0" stop-color="#cfcfcf"/>
    <stop offset="0.45" stop-color="#cfcfcf"/>
    <stop offset="0.5" stop-color="#ffffff"/>
    <stop offset="0.55" stop-color="#cfcfcf"/>
    <stop offset="1" stop-color="#cfcfcf"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="200 0" to="1400 0" dur="5s" begin="1.2s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
  </linearGradient>
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  @keyframes tw { 0%,100% { opacity: 1 } 50% { opacity: .15 } }
  @keyframes up { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes rot {
    0% { opacity: 0; transform: translateY(10px) }
    4% { opacity: 1; transform: translateY(0) }
    21% { opacity: 1; transform: translateY(0) }
    25% { opacity: 0; transform: translateY(-10px) }
    100% { opacity: 0; transform: translateY(-10px) }
  }
  @keyframes draw { from { stroke-dashoffset: 240 } to { stroke-dashoffset: 0 } }
  @keyframes beam { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -1000 } }
  @keyframes shoot {
    0% { transform: translate(1080px, 20px) rotate(158deg); opacity: 0 }
    2% { opacity: 1 }
    11% { transform: translate(640px, 196px) rotate(158deg); opacity: 0 }
    100% { transform: translate(640px, 196px) rotate(158deg); opacity: 0 }
  }
  .a { transform-box: fill-box; transform-origin: center; }
  .name { font-size: 88px; font-weight: 700; letter-spacing: -3px; animation: up 1s cubic-bezier(.2,.7,.2,1) .2s both; }
  .role { font-size: 30px; font-weight: 500; letter-spacing: -0.4px; fill: #e5e5e5; animation: up 1s cubic-bezier(.2,.7,.2,1) .5s both; }
  .rot { font-size: 20px; fill: #a3a3a3; opacity: 0; transform-box: fill-box; transform-origin: center; animation: rot 14s ease-in-out infinite both; }
  .meta { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; letter-spacing: 2.2px; fill: #737373; animation: fade 1.2s ease 1.4s both; }
  .rule { stroke-dasharray: 240; animation: draw 1.4s cubic-bezier(.2,.7,.2,1) 1s both; }
</style>
