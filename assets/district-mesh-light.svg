<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="64" viewBox="0 0 1000 64" role="img" aria-label="NoBars: Chat, location, SOS and calls with no internet"><style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}.ct{font-size:12px;font-weight:500;fill:#515154}.lb{font-size:13px;font-weight:500;fill:#86868b}.up{animation:up 1s cubic-bezier(.22,.8,.24,1) both}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.bi{animation:bi 1.1s cubic-bezier(.22,.8,.24,1) both}@keyframes bi{from{opacity:0;filter:blur(10px);transform:translateY(6px)}to{opacity:1;filter:blur(0);transform:none}}.hl{transform-box:fill-box;transform-origin:left;animation:hl 1.4s cubic-bezier(.22,.8,.24,1) both}@keyframes hl{from{transform:scaleX(0)}to{transform:scaleX(1)}}.rn{font-size:18px;font-weight:600;letter-spacing:-.3px;fill:#1d1d1f}.rk{font-size:14.5px;fill:#515154}.rd{font-size:14.5px;fill:#86868b}.ra{font-size:16px;fill:#86868b}</style><rect class="hl" style="animation-delay:0.10s" x="0" y="0" width="1000" height="1" fill="rgba(0,0,0,.10)"/><g class="up" style="animation-delay:0.20s"><text class="rn" x="0" y="39">NoBars</text><text class="rk" x="200" y="39">iOS</text><text class="rd" x="440" y="39">Chat, location, SOS and calls with no internet</text><text class="ra" x="1000" y="39" text-anchor="end">↗</text></g></svg>
