<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-label="SketchRacer: draw a track and race it"><style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}.ct{font-size:12px;font-weight:500;fill:#515154}.lb{font-size:13px;font-weight:500;fill:#86868b}.up{animation:up 1s cubic-bezier(.22,.8,.24,1) both}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.bi{animation:bi 1.1s cubic-bezier(.22,.8,.24,1) both}@keyframes bi{from{opacity:0;filter:blur(10px);transform:translateY(6px)}to{opacity:1;filter:blur(0);transform:none}}.hl{transform-box:fill-box;transform-origin:left;animation:hl 1.4s cubic-bezier(.22,.8,.24,1) both}@keyframes hl{from{transform:scaleX(0)}to{transform:scaleX(1)}}.trk{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.8s cubic-bezier(.22,.8,.24,1) .1s forwards}@keyframes draw{to{stroke-dashoffset:0}}.t{font-size:38px;font-weight:700;letter-spacing:-1.4px;fill:#1d1d1f}.d{font-size:16px;fill:#515154}.clk{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace;font-size:32px;font-weight:600;fill:#1d1d1f}.cta{font-size:14px;font-weight:600;fill:#1d1d1f}.rs{animation:rs 6.0s steps(6) 2.0s infinite}@keyframes rs{to{transform:translateY(-240px)}}.rt{animation:rt 1.0s steps(10) 2.0s infinite}@keyframes rt{to{transform:translateY(-400px)}}.rh{animation:rh 0.1s steps(10) 2.0s infinite}@keyframes rh{to{transform:translateY(-400px)}}.lp{animation:lp 18.0s steps(3) 2.0s infinite}@keyframes lp{to{transform:translateY(-120px)}}</style><rect x=".5" y=".5" width="999" height="289" rx="22" fill="rgba(0,0,0,.018)" stroke="rgba(0,0,0,.10)"/><text class="lb up" x="40" y="64">Play</text><text class="t up" style="animation-delay:0.08s" x="38" y="110">Draw a track. Race it.</text><g class="up" style="animation-delay:0.16s"><text class="d" x="40" y="142">Freehand a loop in SketchRacer and it becomes a</text><text class="d" x="40" y="165">real track with checkpoints and lap timing.</text></g><g class="up" style="animation-delay:0.28s"><text class="lb" x="40" y="200">Lap time</text><text class="clk" x="40" y="238">0:0</text><text class="clk" x="117" y="238">.</text><clipPath id="qs"><rect x="97" y="208" width="21" height="40"/></clipPath><g clip-path="url(#qs)"><g class="rs"><text class="clk" x="98" y="238">0</text><text class="clk" x="98" y="278">1</text><text class="clk" x="98" y="318">2</text><text class="clk" x="98" y="358">3</text><text class="clk" x="98" y="398">4</text><text class="clk" x="98" y="438">5</text><text class="clk" x="98" y="478">0</text></g></g><clipPath id="qt"><rect x="135" y="208" width="21" height="40"/></clipPath><g clip-path="url(#qt)"><g class="rt"><text class="clk" x="136" y="238">0</text><text class="clk" x="136" y="278">1</text><text class="clk" x="136" y="318">2</text><text class="clk" x="136" y="358">3</text><text class="clk" x="136" y="398">4</text><text class="clk" x="136" y="438">5</text><text class="clk" x="136" y="478">6</text><text class="clk" x="136" y="518">7</text><text class="clk" x="136" y="558">8</text><text class="clk" x="136" y="598">9</text><text class="clk" x="136" y="638">0</text></g></g><clipPath id="qh"><rect x="155" y="208" width="21" height="40"/></clipPath><g clip-path="url(#qh)"><g class="rh"><text class="clk" x="156" y="238">0</text><text class="clk" x="156" y="278">1</text><text class="clk" x="156" y="318">2</text><text class="clk" x="156" y="358">3</text><text class="clk" x="156" y="398">4</text><text class="clk" x="156" y="438">5</text><text class="clk" x="156" y="478">6</text><text class="clk" x="156" y="518">7</text><text class="clk" x="156" y="558">8</text><text class="clk" x="156" y="598">9</text><text class="clk" x="156" y="638">0</text></g></g><text class="lb" x="230" y="200">Lap</text><clipPath id="ql"><rect x="229" y="208" width="80" height="40"/></clipPath><g clip-path="url(#ql)"><g class="lp"><text class="clk" x="230" y="238">1/3</text><text class="clk" x="230" y="278">2/3</text><text class="clk" x="230" y="318">3/3</text><text class="clk" x="230" y="358">1/3</text></g></g></g><text class="cta up" style="animation-delay:0.36s" x="360" y="238">sketchracer.com ↗</text><path class="trk" pathLength="1000" d="M600,212 C568,160 584,78 660,66 C736,54 770,122 834,104 C898,86 958,98 958,160 C958,222 900,246 822,238 C760,232 742,196 700,218 C660,240 622,250 600,212 Z" fill="none" stroke="rgba(0,0,0,.10)" stroke-width="24" stroke-linejoin="round"/><path class="trk" pathLength="1000" d="M600,212 C568,160 584,78 660,66 C736,54 770,122 834,104 C898,86 958,98 958,160 C958,222 900,246 822,238 C760,232 742,196 700,218 C660,240 622,250 600,212 Z" fill="none" stroke="#86868b" stroke-width="1.2" opacity=".6" style="animation-delay:0.25s"/><line x1="589.8" y1="218.3" x2="610.2" y2="205.7" stroke="#fff" stroke-width="5"/><line x1="589.8" y1="218.3" x2="610.2" y2="205.7" stroke="#1d1d1f" stroke-width="5" stroke-dasharray="3 3"/><path pathLength="1000" d="M600,212 C568,160 584,78 660,66 C736,54 770,122 834,104 C898,86 958,98 958,160 C958,222 900,246 822,238 C760,232 742,196 700,218 C660,240 622,250 600,212 Z" fill="none" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round" stroke-dasharray="80 920" stroke-dashoffset="80" opacity="0"><set attributeName="opacity" to=".5" begin="2.0s"/><animate attributeName="stroke-dashoffset" from="80" to="-920" dur="6.0s" begin="2.0s" repeatCount="indefinite"/></path><g opacity="0"><set attributeName="opacity" to="1" begin="2.0s"/><animateMotion dur="6.0s" begin="2.0s" repeatCount="indefinite" rotate="auto" path="M600,212 C568,160 584,78 660,66 C736,54 770,122 834,104 C898,86 958,98 958,160 C958,222 900,246 822,238 C760,232 742,196 700,218 C660,240 622,250 600,212 Z"/><rect x="-9" y="-5" width="18" height="10" rx="3" fill="#1d1d1f"/><rect x="2" y="-3.5" width="4" height="7" rx="1" fill="#fff" opacity=".7"/></g>