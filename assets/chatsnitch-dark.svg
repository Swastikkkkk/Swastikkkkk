<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300" role="img" aria-label="ChatSnitch: Shows which of your extensions can read your ChatGPT, Claude and Gemini chats. One permission, no network."><style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.mono{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace}.chip{font-size:12px;font-weight:500;fill:#a1a1a1}.n{font-size:26px;font-weight:700;letter-spacing:-.7px;fill:#fafafa}.k{font-size:11px;letter-spacing:1.4px;fill:#6b6b6b}.big{font-size:64px;font-weight:700;letter-spacing:-2.5px;fill:#fafafa}.bl{font-size:14px;fill:#a1a1a1}.d{font-size:14px;fill:#a1a1a1}.go{font-size:13px;font-weight:600;fill:#fafafa}.rise{animation:rise 1s cubic-bezier(.2,.7,.2,1) .2s both}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}</style><rect x=".5" y=".5" width="499" height="299" rx="20" fill="#111111" stroke="#262626"/><text class="k mono" x="28" y="44">CHROME EXTENSION</text><text class="go" x="472" y="44" text-anchor="end">Open ↗</text><text class="n" x="27" y="82">ChatSnitch</text><g><text class="big" x="24" y="164">1</text><text class="bl" x="80" y="136">permission, zero network access,</text><text class="bl" x="80" y="156">nothing leaves the browser</text></g><line x1="28" y1="192" x2="472" y2="192" stroke="#262626"/><text class="d" x="28" y="220">Shows which of your extensions can read your ChatGPT, Claude</text><text class="d" x="28" y="240">and Gemini chats. One permission, no network.</text><rect x="28" y="254" width="99" height="26" rx="13" fill="#1a1a1a" stroke="#2e2e2e"/><text x="77" y="271" text-anchor="middle" class="chip">Manifest V3</text><rect x="135" y="254" width="92" height="26" rx="13" fill="#1a1a1a" stroke="#2e2e2e"/><text x="180" y="271" text-anchor="middle" class="chip">JavaScript</text></svg>
