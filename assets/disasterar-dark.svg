<svg xmlns="http://www.w3.org/2000/svg" width="330" height="196" viewBox="0 0 330 196" role="img" aria-label="DisasterAR: Indoor evacuation in AR, fully offline. Routes around hazards to the nearest safe exit."><style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif}.mono{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace}.ct{font-size:12px;font-weight:500;fill:#a1a1a6}.k{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;letter-spacing:1.6px;fill:#6e6e73}.up{animation:up .9s cubic-bezier(.22,.8,.24,1) both}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.fade{animation:fade 1.2s ease both}@keyframes fade{from{opacity:0}to{opacity:1}}.n{font-size:20px;font-weight:700;letter-spacing:-.5px;fill:#f5f5f7}.d{font-size:13px;fill:#a1a1a6}.go{font-size:15px;fill:#6e6e73}</style><rect x=".5" y=".5" width="329" height="195" rx="18" fill="rgba(255,255,255,.025)" stroke="rgba(255,255,255,.10)"/><text class="k up" style="animation-delay:0.24s" x="22" y="36">IOS, ARKIT</text><text class="go up" style="animation-delay:0.24s" x="308" y="38" text-anchor="end">↗</text><text class="n up" style="animation-delay:0.32s" x="21" y="70">DisasterAR</text><g class="up" style="animation-delay:0.40s"><text class="d" x="22" y="96">Indoor evacuation in AR, fully offline.</text><text class="d" x="22" y="115">Routes around hazards to the nearest safe</text><text class="d" x="22" y="134">exit.</text></g><g class="up" style="animation-delay:0.48s"><g class="chip" style=""><rect x="22" y="152" width="56" height="26" rx="13" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.10)"/><text x="50" y="169" text-anchor="middle" class="ct">Swift</text></g><g class="chip" style=""><rect x="86" y="152" width="56" height="26" rx="13" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.10)"/><text x="115" y="169" text-anchor="middle" class="ct">ARKit</text></g></g></svg>
